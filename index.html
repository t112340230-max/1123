<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天</title>
<style>
:root{
  --bg:#F3F4F1; --ink:#23282A; --muted:#6B7370; --faint:#9AA098; --rule:#D9DCD6;
  --paper:#FBFBF9;
  --c:#3D6B5C;  --c-bg:#E4EDE8;
  --gs:#A8422A; --gs-bg:#F4E7E2;
  --ml:#4A5F7A; --ml-bg:#E6EBF0;
  --jg:#6B5B8A; --jg-bg:#EBE7F0;
  --l:#8A8E86;  --l-bg:#EAEBE6;
  --x:#4A5F7A;  --x-bg:#E6EBF0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.7}
.wrap{max-width:620px;margin:0 auto;padding:34px 20px 80px}
p{margin:0}

.date{color:var(--muted);font-size:14px}
.ctx{color:var(--faint);font-size:13px;margin-top:2px}

.now{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:20px 20px 18px;margin:22px 0 0}
.now .lab{font-size:12.5px;color:var(--faint);letter-spacing:.08em}
.now .big{font-size:27px;font-weight:500;line-height:1.35;margin-top:6px;letter-spacing:-.01em}
.now .sub{color:var(--muted);font-size:15px;margin-top:6px}
.now .clock{color:var(--faint);font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}
.now.rest .big{color:var(--muted)}

h2{font-size:13px;font-weight:500;color:var(--faint);letter-spacing:.08em;margin:34px 0 10px}

.row{display:grid;grid-template-columns:96px 3px 1fr;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:0}
.row .t{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.row .k{align-self:stretch;border-radius:2px;min-height:18px}
.row .n .s{display:block;color:var(--muted);font-size:12.5px}
.row.done{opacity:.34}
.row.here .t{color:var(--ink);font-weight:500}
.k.c{background:var(--c)} .k.gs{background:var(--gs)} .k.ml{background:var(--ml)}
.k.jg{background:var(--jg)} .k.l{background:var(--l)} .k.x{background:var(--x)}

.tick{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.tick:first-of-type{border-top:0}
.tick .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.gs{background:var(--gs)} .dot.ml{background:var(--ml)} .dot.jg{background:var(--jg)}
.tick .who{width:38px;font-size:14px;color:var(--muted)}
.tick .what{flex:1;font-size:14.5px}
.tick .what em{font-style:normal;color:var(--muted);font-size:13px;display:block}
button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.mini{padding:3px 9px;color:var(--faint)}

.rule{background:var(--gs-bg);border-left:3px solid var(--gs);border-radius:0 6px 6px 0;
  padding:11px 14px;margin:26px 0 0;font-size:14px}
.rule b{font-weight:500;color:var(--gs)}

details{border-top:1px solid var(--rule);padding:12px 0}
details summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋";color:var(--faint);font-size:13px}
details[open] summary::before{content:"−"}
details .body{padding-top:12px}

.bar{height:6px;background:#E4E6E1;border-radius:3px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;border-radius:3px}
.bar i.gs{background:var(--gs)} .bar i.ml{background:var(--ml)} .bar i.jg{background:var(--jg)}
.pline{display:flex;align-items:baseline;gap:8px;font-size:13.5px;margin-top:10px}
.pline .rr{margin-left:auto;color:var(--faint);font-size:12.5px}

.gridwrap{overflow-x:auto}
.tt{min-width:560px;display:grid;grid-template-columns:44px repeat(7,1fr);gap:2px}
.tt .hd{font-size:12px;color:var(--muted);text-align:center;padding:3px 0}
.tt .hd.now2{color:var(--ink);font-weight:500;border-bottom:2px solid var(--ink)}
.tt .hd .hh{display:block;font-size:10px;color:var(--l)}
.tt .hr{font-size:10px;color:var(--faint);text-align:right;padding-right:5px;transform:translateY(-5px)}
.col{display:grid;grid-auto-rows:20px}
.blk{border-radius:3px;font-size:10.5px;line-height:1.25;padding:1px 3px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;text-align:center}
.blk.c{background:var(--c-bg);color:var(--c)} .blk.gs{background:var(--gs-bg);color:var(--gs)}
.blk.ml{background:var(--ml-bg);color:var(--ml)} .blk.jg{background:var(--jg-bg);color:var(--jg)}
.blk.l{background:var(--l-bg);color:var(--l)} .blk.x{background:var(--x-bg);color:var(--x)}

table.d{width:100%;border-collapse:collapse;font-size:14px}
table.d td{padding:6px 0;border-top:1px solid var(--rule);vertical-align:baseline}
table.d tr:first-child td{border-top:0}
table.d .dd{width:96px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
table.d .ww{color:var(--faint);font-size:12.5px}
tr.past td{opacity:.35}

ul.todo{list-style:none;margin:0;padding:0}
ul.todo li{border-top:1px solid var(--rule);padding:9px 0;display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
ul.todo li:first-child{border-top:0}
ul.todo input{margin:6px 0 0;width:15px;height:15px;accent-color:var(--c);flex:none}
ul.todo .nt{display:block;color:var(--muted);font-size:12.5px}
ul.todo li.done{opacity:.36;text-decoration:line-through}
label{cursor:pointer}
:focus-visible{outline:2px solid var(--ml);outline-offset:2px}
.foot{color:var(--faint);font-size:12.5px;padding-top:28px;border-top:1px solid var(--rule);margin-top:28px}
</style>
</head>
<body>
<div class="wrap">

<p class="date" id="date">—</p>
<p class="ctx" id="ctx"></p>

<div class="now" id="now"></div>

<h2>今天</h2>
<div id="day"></div>

<h2>要開哪一堂</h2>
<div id="ticks"></div>

<div class="rule"><b>卡住 40 分鐘就跳過。</b>標記起來，週日集中處理或問張老師。不要重播第八次。</div>

<h2 style="margin-bottom:0">其他</h2>
<details>
  <summary>這一週</summary>
  <div class="body gridwrap"><div class="tt" id="tt"></div></div>
</details>
<details>
  <summary>三科走到哪了</summary>
  <div class="body" id="prog"></div>
</details>
<details>
  <summary>接下來的關鍵日</summary>
  <div class="body"><table class="d"><tbody id="dates"></tbody></table></div>
</details>
<details>
  <summary>還沒解決的事</summary>
  <div class="body"><ul class="todo" id="todo"></ul></div>
</details>

<p class="foot">只有「今天」那一段要緊，其他都收起來了。<br>
考試日期是暫定值，簡章公告後改檔案裡的 EXAM_DATE。進度存在這台裝置的瀏覽器裡。</p>

</div>

 [["09:00","12:00","gs","工數"],["12:00","13:00","l","午餐"],["13:00","15:00","c","建築環控"],

 [["09:00","12:00","gs","工數"],["12:00","13:00","l","午餐"],["13:00","14:00","c","結構學(二)"],

const day1=864e5;
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=d=>(d.getMonth()+1)+"/"+d.getDate();
const wd=["日","一","二","三","四","五","六"];
const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const diff=(a,b)=>Math.round((b-a)/day1);
const start=pd(TERM_START), exam=pd(EXAM_DATE);

document.getElementById("date").textContent=
  (today.getMonth()+1)+" 月 "+today.getDate()+" 日　星期"+wd[today.getDay()];

let prog={}; try{prog=JSON.parse(localStorage.getItem("plan-prog")||"{}")}catch(e){}
for(const k in SUBJ) if(typeof prog[k]==="number") SUBJ[k].done=prog[k];
const save=()=>{try{localStorage.setItem("plan-prog",JSON.stringify(
  Object.fromEntries(Object.keys(SUBJ).map(k=>[k,SUBJ[k].done]))))}catch(e){}};
const nextL=k=>SUBJ[k].done<SUBJ[k].list.length?SUBJ[k].list[SUBJ[k].done]:null;

function planFor(d){
  const key=iso(d);
  if(PRE[key]) return {b:PRE[key],r:""};
  let r=HOL[key]||"";
  if(!r) for(const[a,b,n] of NOCLASS) if(d>=pd(a)&&d<=pd(b)) r=n;
  if(r){ const b=STUDY.slice(); if([1,3,5].includes(d.getDay())) b.push(["21:00","22:00","l","攀岩"]); return {b,r}; }
  return {b:SCH[(d.getDay()===0?7:d.getDay())-1],r:""};
}

  (diff(today,start)>0 ? "開學前　" : (wkn>=1&&wkn<=18?"第 "+wkn+" 週　":"")) +
  (plan.r?plan.r+"　":"") + "考試還有 "+Math.max(0,diff(today,exam))+" 天";

  for(const b of plan.b){ const s=+b[0].slice(0,2), e=+b[1].slice(0,2); if(H>=s&&H<e) cur=b; }

    el.innerHTML='<p class="lab">現在</p><p class="big">睡覺</p><p class="sub">23:00 – 08:00，九小時不動。</p>';

  }
  if(!cur){
    const nx=plan.b.find(b=>+b[0].slice(0,2)>H);
    el.className="now rest";
    el.innerHTML='<p class="lab">現在</p><p class="big">空檔</p>'+
      (nx?'<p class="sub">下一個是 '+nx[0]+'　'+nx[3]+'</p>':'<p class="sub">今天到這裡。</p>');
    return;
  }
  const k=cur[2], nl=SUBJ[k]?nextL(k):null;
  el.className="now"+(k==="l"?" rest":"");
  el.innerHTML='<p class="lab">現在</p><p class="big">'+cur[3]+'</p>'+
    (nl?'<p class="sub">開第 '+nl[0]+' 堂　'+nl[1]+'</p>':'')+
    '<p class="clock">'+cur[0]+' – '+cur[1]+'</p>';
})();

/* 今天 */
document.getElementById("day").innerHTML = plan.b.map(([a,b,k,t])=>{
  const s=+a.slice(0,2), e=+b.slice(0,2), gone=H>=e, here=H>=s&&H<e;
  const nl=SUBJ[k]?nextL(k):null;
  return '<div class="row'+(gone?" done":"")+(here?" here":"")+'">'+
    '<span class="t">'+a+' – '+b+'</span><span class="k '+k+'"></span>'+
    '<span class="n">'+t+(nl?'<span class="s">第 '+nl[0]+' 堂　'+nl[1]+'</span>':'')+'</span></div>';
}).join("") + '<div class="row"><span class="t">23:00 – 08:00</span><span class="k l"></span><span class="n">睡覺</span></div>';

/* 要開哪一堂 */
function ticks(){
  document.getElementById("ticks").innerHTML = Object.keys(SUBJ).map(k=>{
    const s=SUBJ[k], nl=nextL(k);
    return '<div class="tick"><span class="dot '+k+'"></span><span class="who">'+s.name+'</span>'+
      '<span class="what">'+(nl?'第 '+nl[0]+' 堂<em>'+nl[1]+'</em>':'全部看完了')+'</span>'+
      '<button data-k="'+k+'" data-v="1">看完了</button>'+
      '<button class="mini" data-k="'+k+'" data-v="-1">−</button></div>';
  }).join("");
  document.querySelectorAll(".tick button").forEach(b=>b.onclick=()=>{
    const s=SUBJ[b.dataset.k];
    s.done=Math.max(0,Math.min(s.total,s.done + +b.dataset.v));
    save(); ticks(); progress();
  });
}

/* 進度 */
function progress(){
  document.getElementById("prog").innerHTML = Object.keys(SUBJ).map(k=>{
    const s=SUBJ[k], p=Math.round(s.done/s.total*100);
    return '<div class="pline"><b style="font-weight:500">'+s.name+'</b>'+
      '<span style="color:var(--muted)">'+s.done+' / '+s.total+' 堂</span>'+
      '<span class="rr">'+p+'%</span></div>'+
      '<div class="bar"><i class="'+s.cls+'" style="width:'+p+'%"></i></div>';
  }).join("") + '<p class="ww" style="color:var(--faint);font-size:12.5px;margin-top:12px">'+
    '每週只看三件事：工數推到第幾堂、這週有幾天完全沒讀、標記幾個卡點解決幾個。</p>';
}

/* 這一週 */
(function(){
  const H0=8,H1=23;
  const mon=new Date(today); mon.setDate(mon.getDate()-((today.getDay()===0?7:today.getDay())-1));
  const wkd=[]; for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);wkd.push(d)}
  const dow=today.getDay()===0?7:today.getDay();
  let h='<div></div>';
  for(let i=0;i<7;i++){ const r=planFor(wkd[i]).r;
    h+='<div class="hd'+(i+1===dow?" now2":"")+'">'+wd[(i+1)%7]+(HOL[iso(wkd[i])]?'<span class="hh">'+HOL[iso(wkd[i])]+'</span>':'')+'</div>'; }
  h+='<div class="col">'; for(let x=H0;x<=H1;x++) h+='<div class="hr">'+(x<10?"0"+x:x)+'</div>'; h+='</div>';
  for(let i=0;i<7;i++){ h+='<div class="col">'; let cur=H0;
    for(const[a,b,k,t] of planFor(wkd[i]).b){ const s=+a.slice(0,2),e=+b.slice(0,2);
      if(s>cur) h+='<div style="grid-row:span '+(s-cur)+'"></div>';
      h+='<div class="blk '+k+'" style="grid-row:span '+(e-s)+'">'+t+'</div>'; cur=e; }
    h+='</div>'; }
  document.getElementById("tt").innerHTML=h;
})();

/* 關鍵日：只顯示接下來八筆 */
document.getElementById("dates").innerHTML = D.filter(e=>pd(e[0])>=today).slice(0,8).map(e=>{
  const d=pd(e[0]);
  return '<tr><td class="dd">'+fmt(d)+'（'+wd[d.getDay()]+'）</td>'+
    '<td>'+e[1]+(e[2]?'<br><span class="ww">'+e[2]+'</span>':'')+'</td></tr>';
}).join("") || '<tr><td>結束了。</td></tr>';

];

todo.innerHTML=TODO.map(([id,t,n])=>

ticks(); progress();
